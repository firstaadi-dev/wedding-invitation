{
  "$kind": "http-request",
  "url": "{{cmsBaseUrl}}/api/admin/billing/payments",
  "method": "POST",
  "description": "CMS session, Origin and X-CSRF-Token required. Price and duration are determined by server. Repeated checkout calls reuse the unexpired payment. Activation requires a matching IDR amount and settlement from authenticated Midtrans status API, never a browser redirect. Entitlement is applied once per paid order.",
  "headers": {
    "Accept": "application/json",
    "Origin": "{{cmsOrigin}}",
    "Cookie": "{{billingCookie}}",
    "X-CSRF-Token": "{{billingCsrf}}",
    "Content-Type": "application/json"
  },
  "order": 3000,
  "body": {
    "type": "json",
    "content": "{}"
  },
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('Request succeeds',()=>pm.response.to.have.status(200));\npm.test('Checkout uses the server price and Midtrans',()=>{const p=pm.response.json();pm.expect(p.amount).to.eql(199000);pm.expect(p.checkoutUrl).to.match(/^https:\\/\\/app(?:\\.sandbox)?\\.midtrans\\.com\\//);});"
    }
  ]
}
