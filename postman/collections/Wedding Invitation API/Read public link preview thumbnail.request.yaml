$kind: http-request
url: '{{previewImageUrl}}'
method: GET
auth:
  type: noauth
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Thumbnail is readable without an admin or guest session', () => pm.response.to.have.status(200));
      pm.test('Thumbnail is served as JPEG', () => pm.expect(pm.response.headers.get('Content-Type')).to.eql('image/jpeg'));
      pm.test('Thumbnail body is present', () => pm.expect(Number(pm.response.headers.get('Content-Length'))).to.be.above(0));
