$kind: http-example
request:
  url: "{{baseUrl}}/api/access/verify"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "challenge": "string",
        "eventId": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ok": true
      }
order: 1000
