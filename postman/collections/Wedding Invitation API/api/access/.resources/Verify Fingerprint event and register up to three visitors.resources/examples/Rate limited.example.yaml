$kind: http-example
request:
  url: "{{baseUrl}}/api/access/verify"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "challenge": "string",
        "eventId": "string"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string"
      }
order: 9000
