$kind: http-example
request:
  url: "{{cmsBaseUrl}}/api/admin/content"
  method: PUT
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-Token
      value: string
      disabled: false
      description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "eventDate": "2027-01-09",
        "venueName": "Gedung Baru, Jakarta",
        "countdownTime": "09:00",
        "mapEmbedUrl": ""
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "settings": {
          "eventDate": "2027-01-09",
          "venueName": "Gedung Baru, Jakarta",
          "countdownTime": "09:00",
          "whatsappTemplate": "Yth. {nama},\n{tanggal}\n{tempat}\n{link}"
        },
        "media": {
          "key_0": "string"
        }
      }
order: 1000
