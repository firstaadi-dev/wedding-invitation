$kind: http-request
name: Save event date, venue, event times and official map embed URL
description: Save the event date, venue, displayed times, WIB countdown start and official map embed URL
url: "{{cmsBaseUrl}}/api/admin/content"
method: PUT
headers:
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: "{{csrf}}"
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{cmsOrigin}}"
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "ceremonyTime": "09.00 WIB",
      "receptionTime": "11.00–13.00 WIB",
      "eventDate": "2027-01-09",
      "ceremonyDate": "2027-01-08",
      "receptionDate": "2027-01-10",
      "countdownDate": "2027-01-07",
      "ceremonyVenue": "Rumah keluarga",
      "receptionVenue": "Gedung resepsi",
      "venueName": "Gedung Baru, Jakarta",
      "mapEmbedUrl": "",
      "ceremonyTitle": "Akad",
      "receptionTitle": "Resepsi",
      "countdownTime": "09:00",
      "whatsappTemplate": "Yth. {nama},\n{tanggal} · {tempat}\n{jam_acara_1} · {jam_acara_2}\n{link}",
      "linkPreviewTitle": "Firsta & Talitha — Undangan",
      "linkPreviewDescription": "22 November 2026 · Arjuna Ballroom Alam Indah Resto."
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Save event times and official map embed URL.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Event settings save succeeds', () => pm.response.to.have.status(200));
      const settings = pm.response.json().settings;
      pm.test('Custom ceremony name saved', () => pm.expect(settings.ceremonyTitle).to.eql('Akad'));
      pm.test('Reception name saved', () => pm.expect(settings.receptionTitle).to.eql('Resepsi'));
      pm.test('WIB countdown time saved', () => pm.expect(settings.countdownTime).to.eql('09:00'));
      pm.test('Event date saved', () => pm.expect(settings.eventDate).to.eql('2027-01-09'));
      pm.test('Venue saved', () => pm.expect(settings.venueName).to.eql('Gedung Baru, Jakarta'));
      pm.test('Global message saved', () => pm.expect(settings.whatsappTemplate).to.include('{link}'));
      pm.test('Preview title saved', () => pm.expect(settings.linkPreviewTitle).to.eql('Firsta & Talitha — Undangan'));
      for (const [key, value] of Object.entries({ceremonyDate:'2027-01-08', receptionDate:'2027-01-10', countdownDate:'2027-01-07', ceremonyVenue:'Rumah keluarga', receptionVenue:'Gedung resepsi'})) {
        pm.test(key + ' saved independently', () => pm.expect(settings[key]).to.eql(value));
      }
      pm.test('Both event time tokens persist', () => pm.expect(settings.whatsappTemplate).to.include('{jam_acara_1}').and.include('{jam_acara_2}'));
      pm.collectionVariables.set('savedSettings', JSON.stringify(settings));
