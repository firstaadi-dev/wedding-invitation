$kind: http-example
name: Forbidden / three-device limit / verification rejected
request:
  url: "{{baseUrl}}/api/admin/session"
  method: GET
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string"
      }
order: 4000
