$kind: http-example
request:
  url: "{{cmsBaseUrl}}/api/admin/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "owner@example.com",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "csrf": "string",
        "account": {"email": "owner@example.com", "invitationOrigin": "https://invitation.domain.id", "tenant": {"id": "wedding", "slug": "wedding", "publicId": "d291b953-df84-463b-8319-80aff739c16a", "name": "Wedding"}}
      }
order: 1000
