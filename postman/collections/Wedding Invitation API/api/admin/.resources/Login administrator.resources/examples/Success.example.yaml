$kind: http-example
request:
  url: "{{baseUrl}}/api/admin/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "owner@example.com",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "csrf": "string",
        "account": {"email": "owner@example.com", "tenant": {"id": "wedding", "slug": "wedding", "name": "Wedding"}}
      }
order: 1000
