$kind: http-example
request:
  url: "{{baseUrl}}/api/admin/login"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "password": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string"
      }
order: 3000
