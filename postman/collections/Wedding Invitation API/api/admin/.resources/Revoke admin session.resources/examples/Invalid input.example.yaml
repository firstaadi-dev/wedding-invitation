$kind: http-example
request:
  url: "{{cmsBaseUrl}}/api/admin/logout"
  method: POST
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-Token
      value: string
      disabled: false
      description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
    - key: Accept
      value: application/json
  body:
    type: json
    content: "{}"
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string"
      }
order: 2000
