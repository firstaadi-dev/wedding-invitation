$kind: http-request
name: Upload/replaces a photo or MP3 music slot
description: Raw binary body, no multipart. Photos up to 12 MiB, decoded/re-encoded by Sharp; music MP3 up to 25 MiB with frame validation. Old file removed after committed replacement. The preview slot produces a public 1200×630 JPEG thumbnail; other slots remain private.
url: "{{cmsBaseUrl}}/api/admin/media/:slot"
method: PUT
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: image/jpeg
  - key: Accept
    value: application/json
pathVariables:
  - key: slot
    value: '{{mediaSlot}}'
body:
  type: file
  content: {}
auth:
  type: noauth
settings: {}
examples: ./.resources/Upload-replaces a photo or MP3 music slot.resources/examples
order: 1000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Media upload succeeds', () => pm.response.to.have.status(200));
      const slot=pm.variables.get('mediaSlot');
      pm.test('Uploaded media is returned for selected slot', () => pm.expect(pm.response.json().media[slot]).to.match(/^\/media\/[a-f0-9-]{36}$/));
