$kind: http-request
name: Upload or replace a photo or background audio
description: Raw binary body. Photos up to 12 MiB; MP3, M4A, AAC, WAV, OGG/Opus, FLAC and WebM audio up to 25 MiB. MP3 is validated and preserved, including consecutive ID3v2 tags; other formats are converted to MP3. Failed uploads preserve existing media.
url: "{{cmsBaseUrl}}/api/admin/media/:slot"
method: PUT
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: image/jpeg
  - key: Accept
    value: application/json
pathVariables:
  - key: slot
    value: '{{mediaSlot}}'
body:
  type: file
  content: {}
auth:
  type: noauth
settings: {}
examples: ./.resources/Upload-replaces a photo or MP3 music slot.resources/examples
order: 1000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Media upload succeeds', () => pm.response.to.have.status(200));
      const slot=pm.variables.get('mediaSlot');
      pm.test('Uploaded media is returned for selected slot', () => pm.expect(pm.response.json().media[slot]).to.match(/^\/media\/[a-f0-9-]{36}$/));
