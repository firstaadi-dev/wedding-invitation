$kind: http-request
description: Remove media from slot
url: "{{baseUrl}}/api/admin/media/:slot"
method: DELETE
headers:
  - key: X-CSRF-Token
    value: string
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Accept
    value: application/json
pathVariables:
  - key: slot
    value: gallery1
    disabled: false
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: wedding_admin
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Remove media from slot.resources/examples
order: 2000
