$kind: http-request
description: Remove media from slot
url: "{{cmsBaseUrl}}/api/admin/media/:slot"
method: DELETE
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: slot
    value: '{{mediaSlot}}'
auth:
  type: noauth
settings: {}
examples: ./.resources/Remove media from slot.resources/examples
order: 2000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Media removal succeeds', () => pm.response.to.have.status(200));
      const slot=pm.variables.get('mediaSlot');
      pm.test('Selected slot is no longer stored', () => pm.expect(pm.response.json().media[slot]).to.be.undefined);
