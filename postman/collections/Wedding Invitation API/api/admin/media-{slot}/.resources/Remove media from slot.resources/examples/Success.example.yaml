$kind: http-example
request:
  url: "{{cmsBaseUrl}}/api/admin/media/:slot"
  method: DELETE
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-Token
      value: string
      disabled: false
      description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
    - key: Accept
      value: application/json
  pathVariables:
    - key: slot
      value: gallery1
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "settings": {
          "ceremonyTime": "string",
          "receptionTime": "string",
          "mapEmbedUrl": "string"
        },
        "media": {
          "key_0": "string"
        }
      }
order: 1000
