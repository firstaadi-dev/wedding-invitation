$kind: http-request
name: Clear recorded browsers and revoke sessions/challenges
description: Clear recorded browsers and revoke sessions/challenges
url: "{{cmsBaseUrl}}/api/admin/guests/:id/devices"
method: DELETE
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{deliveryGuestId}}'
auth:
  type: noauth
settings: {}
examples: ./.resources/Clear recorded browsers and revoke sessions-challenges.resources/examples
order: 4000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Device reset succeeds', () => pm.response.to.have.status(200));
      pm.test('Device reset is acknowledged', () => pm.expect(pm.response.json().ok).to.eql(true));
