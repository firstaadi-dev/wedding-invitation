$kind: http-request
name: Replace guest link; revoke old link/sessions/devices
description: Replace guest link; revoke old link/sessions/devices
url: "{{baseUrl}}/api/admin/guests/:id/link"
method: POST
headers:
  - key: X-CSRF-Token
    value: string
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: "(Required) "
body:
  type: json
  content: "{}"
auth:
  type: apikey
  credentials:
    key: wedding_admin
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Replace guest link; revoke old link-sessions-devices.resources/examples
order: 3000
