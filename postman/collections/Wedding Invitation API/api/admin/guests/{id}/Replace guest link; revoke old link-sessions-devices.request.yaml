$kind: http-request
name: Replace guest link; revoke old link/sessions/devices
description: Replace guest link; revoke old link/sessions/devices
url: "{{cmsBaseUrl}}/api/admin/guests/:id/link"
method: POST
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{deliveryGuestId}}'
body:
  type: json
  content: "{}"
auth:
  type: noauth
settings: {}
examples: ./.resources/Replace guest link; revoke old link-sessions-devices.resources/examples
order: 6000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Guest link replacement succeeds', () => pm.response.to.have.status(200));
      const result=pm.response.json();
      pm.test('Replacement link is new and usable', () => pm.expect(result.link).to.match(/\/u\/[A-Za-z0-9_-]{27}$/));
      pm.collectionVariables.set('deliveryGuestLink',result.link);
      pm.test('Guest identity is preserved', () => pm.expect(result.guest.id).to.eql(pm.variables.get('deliveryGuestId')));
