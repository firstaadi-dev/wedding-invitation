$kind: http-example
request:
  url: "{{cmsBaseUrl}}/api/admin/guests/:id/link"
  method: POST
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-Token
      value: string
      disabled: false
      description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: "{}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "guest": {
          "id": "string",
          "name": "string",
          "active": 1,
          "deviceCount": 1,
          "response": null,
          "createdAt": 3854
        },
        "link": "string"
      }
order: 1000
