$kind: http-example
name: Upstream/configuration unavailable
request:
  url: "{{cmsBaseUrl}}/api/admin/guests/:id"
  method: PATCH
  headers:
    - key: wedding_admin
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-CSRF-Token
      value: string
      disabled: false
      description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "name": "string",
        "active": false
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string"
      }
order: 10000
