$kind: http-request
description: Delete guest and all their access records
url: "{{baseUrl}}/api/admin/guests/:id"
method: DELETE
headers:
  - key: X-CSRF-Token
    value: string
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: wedding_admin
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Delete guest and all their access records.resources/examples
order: 2000
