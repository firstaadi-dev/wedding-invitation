$kind: http-request
description: Delete guest and all their access records
url: "{{cmsBaseUrl}}/api/admin/guests/:id"
method: DELETE
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '{{deliveryGuestId}}'
auth:
  type: noauth
settings: {}
examples: ./.resources/Delete guest and all their access records.resources/examples
order: 2000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Guest deletion succeeds', () => pm.response.to.have.status(200));
      pm.test('Deletion is acknowledged', () => pm.expect(pm.response.json().ok).to.eql(true));
