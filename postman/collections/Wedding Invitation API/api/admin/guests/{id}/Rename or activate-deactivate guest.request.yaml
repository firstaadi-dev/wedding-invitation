$kind: http-request
name: Edit guest name, phone, active status or unlimited exemption
description: Deactivation immediately revokes sessions and challenges. Device slots remain until explicit reset.
url: "{{cmsBaseUrl}}/api/admin/guests/:id"
method: PATCH
headers:
  - key: X-CSRF-Token
    value: "{{csrf}}"
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{cmsBaseUrl}}"
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "{{deliveryGuestId}}"
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "name": "Keluarga Contoh",
      "phone": "+6281234567890",
      "active": false
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Rename or activate-deactivate guest.resources/examples
order: 1000
