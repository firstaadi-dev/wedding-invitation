$kind: http-request
name: Rename or activate/deactivate guest
description: Deactivation immediately revokes sessions and challenges. Device slots remain until explicit reset.
url: "{{baseUrl}}/api/admin/guests/:id"
method: PATCH
headers:
  - key: X-CSRF-Token
    value: string
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "name": "string",
      "active": false
    }
auth:
  type: apikey
  credentials:
    key: wedding_admin
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Rename or activate-deactivate guest.resources/examples
order: 1000
