$kind: http-request
description: Create guest with optional phone and persist a secret link for later copying
url: "{{cmsBaseUrl}}/api/admin/guests"
method: POST
headers:
  - key: X-CSRF-Token
    value: "{{csrf}}"
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Origin
    value: "{{cmsBaseUrl}}"
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Keluarga Contoh",
      "phone": "081234567890"
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Create guest and secret link.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Guest created', () => pm.response.to.have.status(201));
      const result = pm.response.json();
      pm.test('Phone saved internationally', () => pm.expect(result.guest.phone).to.eql('6281234567890'));
      pm.test('Guest includes stored URL', () => pm.expect(result.guest.link).to.eql(result.link));
      pm.collectionVariables.set('deliveryGuestId', result.guest.id);
      pm.collectionVariables.set('deliveryGuestLink', result.link);
