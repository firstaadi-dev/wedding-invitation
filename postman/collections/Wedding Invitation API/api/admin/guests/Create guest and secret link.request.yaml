$kind: http-request
description: Create guest and secret link
url: "{{baseUrl}}/api/admin/guests"
method: POST
headers:
  - key: X-CSRF-Token
    value: string
    disabled: false
    description: (Required) Token returned by admin session/login, matching HttpOnly cookie session.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "string"
    }
auth:
  type: apikey
  credentials:
    key: wedding_admin
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Create guest and secret link.resources/examples
order: 2000
