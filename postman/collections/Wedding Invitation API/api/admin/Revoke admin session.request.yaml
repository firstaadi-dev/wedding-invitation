$kind: http-request
description: Revoke admin session
url: "{{cmsBaseUrl}}/api/admin/logout"
method: POST
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: "{}"
auth:
  type: noauth
settings: {}
examples: ./.resources/Revoke admin session.resources/examples
order: 9000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin logout succeeds', () => pm.response.to.have.status(200));
      pm.test('Session is revoked', () => pm.expect(pm.response.json().ok).to.eql(true));
