url: "{{baseUrl}}/api/admin/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "password": "string"
    }
settings: {}
examples: ./.resources/Login administrator.resources/examples
order: 1000
