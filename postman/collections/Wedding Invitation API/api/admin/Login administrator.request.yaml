$kind: http-request
description: Same-origin JSON only. Password verified using scrypt hash. Sets HttpOnly SameSite=Strict cookie, Secure in production. Rate limited.
url: "{{baseUrl}}/api/admin/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Origin: "{{baseUrl}}"
body:
  type: json
  content: |-
    {
      "password": "{{adminPassword}}"
    }
settings: {}
examples: ./.resources/Login administrator.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Admin login succeeds', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('csrf', pm.response.json().csrf);
