$kind: http-request
method: PATCH
url: '{{cmsBaseUrl}}/api/admin/guests/{{limitGuestId}}'
order: 3000
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "unlimited": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Limit control succeeds', () => pm.response.to.have.status(200));
      pm.test('Invitation is unlimited', () => { pm.expect(pm.response.json().unlimited).to.eql(true); pm.expect(pm.response.json().deviceLimit).to.eql(null); });
      pm.collectionVariables.set('limitDeviceCount', String(pm.response.json().deviceCount));
