$kind: http-request
method: PUT
url: '{{cmsBaseUrl}}/api/admin/content'
order: 1000
headers:
  - key: Origin
    value: '{{cmsOrigin}}'
  - key: Cookie
    value: '{{adminCookie}}'
  - key: X-CSRF-Token
    value: '{{csrf}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "deviceLimit": "5",
      "deviceLimitEnabled": "true"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Limit control succeeds', () => pm.response.to.have.status(200));
      pm.test('Account browser limit saved', () => { pm.expect(pm.response.json().settings.deviceLimit).to.eql('5'); pm.expect(pm.response.json().settings.deviceLimitEnabled).to.eql('true'); });
