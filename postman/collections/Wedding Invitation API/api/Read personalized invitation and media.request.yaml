$kind: http-request
description: Development /preview can read demo content; production always requires active guest session or admin session.
url: "{{baseUrl}}/api/invitation"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Cookie
    value: '{{guestCookie}}'
settings: {}
examples: ./.resources/Read personalized invitation and media.resources/examples
order: 4500

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Invitation is readable for this guest', () => pm.response.to.have.status(200));
      const result = pm.response.json();
      pm.test('Invitation can bind RSVP to this guest session', () => {
        pm.expect(result.canRespond).to.eql(true);
        pm.expect(result.responseToken).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('responseToken', result.responseToken);
