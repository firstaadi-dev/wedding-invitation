name: wedding-invitation
services:
  app:
    image: ${IMAGE:?Set IMAGE to the GHCR image with a commit tag}
    restart: unless-stopped
    env_file:
      - path: ./app.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '5174'
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:5174:5174'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5174/healthz').then(async r=>{if(!r.ok || !(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
